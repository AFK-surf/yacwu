name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (svelte-check, unit tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: bun run check
      - run: bun run test:unit
      - run: bun run build

  backend:
    name: Backend (gleam format, build, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.18.1"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam build --warnings-as-errors
      - run: gleam test

  # The Playwright e2e suite drives a live `codex app-server` and needs an
  # authenticated codex CLI, so it runs locally (`bunx playwright test`), not
  # in CI.
